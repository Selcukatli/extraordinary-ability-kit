name: validate
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm install --no-audit --no-fund
      - name: Validate skill frontmatter and criteria manifests
        run: node scripts/validate-skills.mjs
      - name: Check for personal data
        run: node scripts/check-pii.mjs
      - name: Scaffold, ingest evidence, build a review packet
        run: |
          set -e
          ./skills/petition-workspace/scripts/scaffold-case.sh /tmp/case both
          # O-1A must scaffold 8 criteria, EB-1A 10 — this is the bug the manifests exist to prevent
          test "$(grep -c '^### Criterion' /tmp/case/o1a/evidence-list.md)" = 8
          test "$(grep -c '^### Criterion' /tmp/case/eb1a/evidence-list.md)" = 10
          printf 'x' > /tmp/f.png
          # criterion 7 routes differently per petition type
          node skills/petition-workspace/scripts/add-evidence.mjs /tmp/case -p o1a  -c 7 -d "Org chart" /tmp/f.png
          node skills/petition-workspace/scripts/add-evidence.mjs /tmp/case -p eb1a -c 7 -d "Showcase demo" /tmp/f.png
          test -d /tmp/case/resources/company-docs/org-chart
          test -d /tmp/case/resources/speaking/showcase-demo
          node skills/petition-portal/scripts/build-portal.mjs /tmp/case -o /tmp/packet.html
          test -s /tmp/packet.html
      - name: Add another petition workspace to an existing case
        run: bash scripts/test-scaffold.sh
      - name: Similarity check catches near-duplicate letters
        run: |
          mkdir -p /tmp/l
          printf 'I am writing to offer my strongest support for the petition of the applicant here.\n' > /tmp/l/a.md
          printf 'I am writing to offer my strongest support for the petition of the applicant here.\n' > /tmp/l/b.md
          if node skills/petition-letters/scripts/similarity-check.mjs /tmp/l; then
            echo "expected non-zero exit on duplicate letters"; exit 1
          fi
